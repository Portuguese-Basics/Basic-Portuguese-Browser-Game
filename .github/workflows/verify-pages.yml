name: Verify published game
on:
  push:
    branches: [main]
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: verify-published-game
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser test dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Require the exact release bytes from GitHub Pages
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python - <<'PYCODE'
          import hashlib, os, time, urllib.request
          from pathlib import Path
          target = hashlib.sha256(Path('index.html').read_bytes()).hexdigest()
          url = 'https://portuguese-basics.github.io/Basic-Portuguese-Browser-Game/'
          for attempt in range(30):
              try:
                  req = urllib.request.Request(url + '?release=' + os.environ['RELEASE_SHA'], headers={'Cache-Control': 'no-cache'})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      actual = hashlib.sha256(r.read()).hexdigest()
                  if actual == target:
                      print('PAGES_HASH_VERIFIED', target)
                      break
                  print('Pages is still serving another version', actual)
              except Exception as exc:
                  print(type(exc).__name__, str(exc))
              time.sleep(10)
          else:
              raise SystemExit('Pages never served the exact release within the bounded verification window')
          PYCODE
      - name: Test the published game in isolated desktop and mobile browsers
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          mkdir -p verification-output
          for name in hunts clarity walls economy daily-life map-layout industry; do
            python "verification/browser-$name.py" --url "https://portuguese-basics.github.io/Basic-Portuguese-Browser-Game/?release=$RELEASE_SHA" 2>&1 | tee "verification-output/$name-browser.log"
          done
          python verification/daily-life-live-soak.py --url "https://portuguese-basics.github.io/Basic-Portuguese-Browser-Game/?release=$RELEASE_SHA" --seconds 65 2>&1 | tee verification-output/minute-presence.log
          node verification/industry-live-fixture.js 2>&1 | tee verification-output/industry-live-fixture.log
          python verification/industry-live-soak.py --url "https://portuguese-basics.github.io/Basic-Portuguese-Browser-Game/?release=$RELEASE_SHA" --seconds 65 2>&1 | tee verification-output/industry-live.log
      - name: Preserve source and git history for the Drive backup
        run: |
          git rev-parse HEAD > verification-output/release-commit.txt
          sha256sum index.html > verification-output/index.sha256
          git archive --format=zip --prefix=Basic-Portuguese-Browser-Game/ -o verification-output/release-source.zip HEAD
          git bundle create verification-output/repository-history.bundle --all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-game-verification-${{ github.sha }}
          path: verification-output/
          retention-days: 14
