name: Integrate verified settler daily life
on:
  push:
    branches: [feature/settler-daily-life]
    paths: ['.maintenance/daily-life.part*', '.github/workflows/install-daily-life.yml']
permissions:
  contents: write
defaults:
  run:
    shell: bash
concurrency:
  group: install-settler-daily-life
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/settler-daily-life
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the base, transfer and exact output files
        run: |
          mkdir -p verification-output
          python - <<'PY'
          from pathlib import Path
          import gzip, hashlib, subprocess
          assert hashlib.sha256(Path('index.html').read_bytes()).hexdigest() == '00174c69489a642df70c9ca95c161ff0ea8080b6c5d9ced0fdde2a53890f64d9'
          patch = gzip.decompress(b''.join(Path('.maintenance/daily-life.part'+str(i)).read_bytes() for i in range(4)))
          assert hashlib.sha256(patch).hexdigest() == '44709a0763aaec71888c67cb413a62cfc06d03adac7108f6f412b5935cecb81c'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          expected = {'README.md':'be10f4ebdcbb651b2e0c68b812d304363d062c2d4bcbc5b23a7e067a763710f6','index.html':'d14782e43be0e2f1d2be3227ae6812d3fa64e704020a21e901fc6072ae266623','verification/baseline-equivalence-test.js':'2a3af0b85d0877731104e10b34059b1b74807bba3564be38efcc8c9b72968c4b','verification/browser-daily-life.py':'e3a63dd2eb11e819924b4b2301390f168f28402bc6bd579411994b78c470305d','verification/daily-life-equivalence-test.js':'2b2eec64f94108b38c81dbba0d83e180b064c1834abaf0648d0dd30f7fbfe3c1','verification/daily-life-live-soak.py':'c8ff17412430fac62950e79634250c7dd889bb37aed51fc593ac2ffa5a4f9e2f','verification/daily-life-test.js':'16818bcfe5af57a6d15271ef4c7055fe37118d775c8c52dcd3c10d765e421e9e','verification/performance-daily-life.py':'6aa3fd99b1514e8b986bb08e66d56f30403258923c347e7f563aabb3f49793f3'}
          for path, digest in expected.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == digest, path
              print(digest, path)
          Path('verification-output/installed.sha256').write_text('\n'.join(d+'  '+p for p,d in expected.items())+'\n')
          Path('verification-output/reviewed-change.patch').write_bytes(patch)
          PY
      - name: Existing economy and new presence equivalence regressions
        run: |
          for test in smoke-test militia-hunts-test clarity-test baseline-equivalence-test walls-test economy-test economy-soak-test daily-life-test daily-life-equivalence-test; do
            node "verification/$test.js" | tee "verification-output/$test.log"
          done
      - name: Browser dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Five real-origin browser suites and a full minute of 1x life
        run: |
          python verification/browser-hunts.py | tee verification-output/hunts-browser.log
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/daily-life-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          for feature in clarity walls economy daily-life; do
            python "verification/browser-$feature.py" --url http://127.0.0.1:8765/ | tee "verification-output/$feature-browser.log"
          done
          python verification/daily-life-live-soak.py --url http://127.0.0.1:8765/ --seconds 65 | tee verification-output/minute-presence.log
      - name: Commit only verified game content to the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html README.md verification/baseline-equivalence-test.js verification/browser-daily-life.py verification/daily-life-equivalence-test.js verification/daily-life-live-soak.py verification/daily-life-test.js verification/performance-daily-life.py
          git commit -m 'Restore identity-linked settler daily life without changing wages or hauling'
          git push origin HEAD:refs/heads/feature/settler-daily-life
          git rev-parse HEAD > verification-output/feature-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-life-integration-verification
          path: verification-output/
          retention-days: 14
