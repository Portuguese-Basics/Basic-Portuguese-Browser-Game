name: Integrate verified field and storage clarity
on:
  push:
    branches: [feature/field-storage-clarity]
    paths:
      - '.maintenance/**'
      - '.github/workflows/install-clarity.yml'
permissions:
  contents: write
defaults:
  run:
    shell: bash
concurrency:
  group: install-field-storage-clarity
  cancel-in-progress: false
jobs:
  install:
    if: github.ref == 'refs/heads/feature/field-storage-clarity'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/field-storage-clarity
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact reviewed changes and verify transfer integrity
        run: |
          mkdir -p verification-output
          python .maintenance/install-clarity.py | tee verification-output/installation.log
          sha256sum --check <<'HASHES'
          d4f9e671b33ee4a453525cd4798a122bf89fa3ef9489eae2463f1608514e6599  index.html
          1fc2b81d02aea55180854fa6cff370e22e3c4b9bcdec17d8e44df67c31771954  README.md
          cdc2df009b353b77121642e9aa13947090f1d9d9086e35f3957b31d513af9259  verification/smoke-test.js
          ad08e738dd17726e0802b5a3293236e3b798de5f42255df27c2c2c23f414f850  .github/workflows/regression.yml
          4944ea1a855c7ca6d64ab1840293c9bd75b43fcdb4791808d932df92e89fceaa  .github/workflows/verify-pages.yml
          6c35a7e959a702d61b69e8ef60c060678268babed0eeb2263276f3936d7bab73  verification/clarity-test.js
          c1788c60332dd2b66aa35856e53419539f2e1ef38ad404351f440135e5a71bfe  verification/browser-clarity.py
          262dfa63977d62e447d93a92686271cae0254b22770ae9153a7f02d8d0e18b88  verification/performance-clarity.py
          HASHES
      - name: Full simulation and exact-equivalence regressions
        run: |
          node verification/smoke-test.js | tee verification-output/smoke-test.log
          node verification/militia-hunts-test.js | tee verification-output/militia-hunts-test.log
          node verification/clarity-test.js | tee verification-output/clarity-test.log
      - name: Browser dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Desktop and touch-mobile origin tests
        run: |
          python verification/browser-hunts.py | tee verification-output/browser-hunts.log
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/clarity-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          python verification/browser-clarity.py --url http://127.0.0.1:8765/ | tee verification-output/browser-clarity.log
      - name: Commit only verified game content to the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html README.md verification/smoke-test.js
          git commit -m 'Add clearer fields and storage with exact staffing snapshot reuse'
          git push origin HEAD:refs/heads/feature/field-storage-clarity
          git rev-parse HEAD > verification-output/feature-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-storage-install-verification
          path: verification-output/
          retention-days: 14
