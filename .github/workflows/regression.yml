name: Game regression
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Simulation regressions
        run: |
          mkdir -p verification-output
          for name in smoke-test militia-hunts-test clarity-test baseline-equivalence-test walls-test economy-test economy-soak-test daily-life-test daily-life-equivalence-test map-layout-test map-render-test road-render-test; do
            node "verification/$name.js" 2>&1 | tee "verification-output/$name.log"
          done
          PREVIOUS_RUNTIME_REF=9529f0ce8cc1f43c962f0e665a0ad9ced15c5519 node verification/baseline-equivalence-test.js 2>&1 | tee verification-output/previous-clarity-equivalence.log
          PREVIOUS_RUNTIME_REF=a47830faae4c4c17e680dead01932e9014dbdf14 node verification/baseline-equivalence-test.js 2>&1 | tee verification-output/previous-walls-legacy-mode.log
          PREVIOUS_ACTIVE_REF=c158b99822563e0f94c5f47ac00391e05de0b1c0 node verification/daily-life-equivalence-test.js 2>&1 | tee verification-output/active-previous-map-equivalence.log
      - name: Independent map geometry and utility gates
        run: |
          node verification/export-map-layout.js
          python -m pip install shapely==2.1.2 networkx==3.6.1
          python verification/map-geometry-audit.py 2>&1 | tee verification-output/map-geometry.log
      - name: Browser test dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Desktop and mobile browser checks
        run: |
          python verification/browser-hunts.py 2>&1 | tee verification-output/hunts-browser.log
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/game-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          for name in clarity walls economy daily-life map-layout; do
            python "verification/browser-$name.py" --url http://127.0.0.1:8765/ 2>&1 | tee "verification-output/$name-browser.log"
          done
          python verification/browser-map-render.py 2>&1 | tee verification-output/map-raster.log
          python verification/browser-road-cache.py 2>&1 | tee verification-output/road-cache.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-regression-${{ github.run_id }}
          path: verification-output/
          retention-days: 14
