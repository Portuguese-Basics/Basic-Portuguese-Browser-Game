name: Integrate verified map restructure
on:
  push:
    branches: [feature/map-expansion-bastion]
    paths: ['.maintenance/map-*', '.github/workflows/install-map.yml']
permissions:
  contents: write
defaults:
  run:
    shell: bash
concurrency:
  group: integrate-map-expansion
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/map-expansion-bastion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pinned source, complete transfer and every intended output
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, subprocess
          from pathlib import Path
          assert hashlib.sha256(Path('index.html').read_bytes()).hexdigest() == 'd14782e43be0e2f1d2be3227ae6812d3fa64e704020a21e901fc6072ae266623'
          encoded = ''.join(Path(f'.maintenance/map-part-{i}.b64').read_text() for i in range(1,4))
          assert hashlib.sha256(encoded.encode()).hexdigest() == 'e3e638ea8ddac28da104ef75ce6f8c2c3c7b167d1cc89514832a618a0095e630'
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '5b8fbea3ea6021200cac14ca44aebde4bb3121d8ccec1fb0a5d647ad11d2b3c6'
          Path('/tmp/map.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/map.patch'],check=True)
          subprocess.run(['git','apply','/tmp/map.patch'],check=True)
          for name, expected in json.loads(Path('.maintenance/map-output-sha256.json').read_text()).items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == expected, name
          for label in ['browser','coast']:
              subprocess.run(['git','apply','--check',f'.maintenance/map-{label}-fix.patch'],check=True)
              subprocess.run(['git','apply',f'.maintenance/map-{label}-fix.patch'],check=True)
              for name, expected in json.loads(Path(f'.maintenance/map-{label}-sha256.json').read_text()).items():
                  assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == expected, name
          print('ALL_FINAL_RUNTIME_AND_TEST_HASHES_VERIFIED')
          PY
      - name: Complete regression, historic migration and current economic comparisons
        run: |
          mkdir -p verification-output
          for name in smoke-test militia-hunts-test clarity-test baseline-equivalence-test walls-test economy-test economy-soak-test daily-life-test daily-life-equivalence-test map-layout-test; do
            node "verification/$name.js" 2>&1 | tee "verification-output/$name.log"
          done
          PREVIOUS_RUNTIME_REF=9529f0ce8cc1f43c962f0e665a0ad9ced15c5519 node verification/baseline-equivalence-test.js 2>&1 | tee verification-output/previous-clarity-equivalence.log
          PREVIOUS_RUNTIME_REF=a47830faae4c4c17e680dead01932e9014dbdf14 node verification/baseline-equivalence-test.js 2>&1 | tee verification-output/previous-walls-equivalence.log
          PREVIOUS_ACTIVE_REF=c158b99822563e0f94c5f47ac00391e05de0b1c0 node verification/daily-life-equivalence-test.js 2>&1 | tee verification-output/previous-map-active-equivalence.log
      - name: Independent footprint, roof and utility-network geometry
        run: |
          node verification/export-map-layout.js
          python -m pip install shapely==2.1.2 networkx==3.6.1
          python verification/map-geometry-audit.py 2>&1 | tee verification-output/map-geometry.log
      - name: Browser dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Six real-origin desktop and touch-mobile acceptance suites
        run: |
          python verification/browser-hunts.py 2>&1 | tee verification-output/hunts-browser.log
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/map-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          for name in clarity walls economy daily-life map-layout; do
            python "verification/browser-$name.py" --url http://127.0.0.1:8765/ 2>&1 | tee "verification-output/$name-browser.log"
          done
          python verification/daily-life-live-soak.py --url http://127.0.0.1:8765/ --seconds 65 2>&1 | tee verification-output/minute-presence.log
      - name: Commit only verified game files to the feature branch
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          names=[]
          for label in ['output','browser','coast']:
              names+=list(json.loads(Path(f'.maintenance/map-{label}-sha256.json').read_text()))
          subprocess.run(['git','add','--',*sorted(set(names))],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Expand map area 25 percent and reorganize bastion, town and access networks'
          git push origin HEAD:refs/heads/feature/map-expansion-bastion
          git rev-parse HEAD > verification-output/feature-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-restructure-integration-verification
          path: verification-output/
          retention-days: 14
