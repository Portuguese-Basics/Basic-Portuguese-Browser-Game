name: Finalize verified clarity startup
on:
  push:
    branches: [feature/field-storage-clarity]
    paths: ['.github/workflows/finalize-clarity.yml']
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/field-storage-clarity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve the initial allocation outside read-only rendering
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('index.html')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='d4f9e671b33ee4a453525cd4798a122bf89fa3ef9489eae2463f1608514e6599'
          s=p.read_text()
          old='      carregarProgresso();\n      atualizarInterface();\n      redimensionar();\n      requestAnimationFrame(quadro);'
          new='      carregarProgresso();\n      atualizarInterface();\n      // Preserve the former first-draw allocation on load, outside rendering.\n      if (estado.mapaAtual === "expansao" && estado.coloniaIniciada) {\n        redistribuirTrabalhadoresColonia();\n      }\n      redimensionar();\n      requestAnimationFrame(quadro);'
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='bc5a61a8ee016a27a369486343ab8fae079224283c3401a43713122cfc6755f0'
          PY
      - name: Full simulation and previous-runtime equivalence
        run: |
          mkdir -p verification-output
          node verification/smoke-test.js | tee verification-output/smoke-test.log
          node verification/militia-hunts-test.js | tee verification-output/militia-hunts-test.log
          node verification/clarity-test.js | tee verification-output/clarity-test.log
          node verification/baseline-equivalence-test.js | tee verification-output/baseline-equivalence.log
      - name: Browser dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Real-origin desktop and touch-mobile acceptance
        run: |
          python verification/browser-hunts.py | tee verification-output/browser-hunts.log
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/clarity-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          python verification/browser-clarity.py --url http://127.0.0.1:8765/ | tee verification-output/browser-clarity.log
      - name: Commit verified initialization to feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          git commit -m 'Preserve saved-colony startup allocation outside rendering'
          git push origin HEAD:refs/heads/feature/field-storage-clarity
          git rev-parse HEAD > verification-output/feature-commit.txt
          sha256sum index.html > verification-output/index.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clarity-final-verification
          path: verification-output/
          retention-days: 14
