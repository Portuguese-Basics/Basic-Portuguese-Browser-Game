name: Integrate verified manned walls
on:
  push:
    branches: [feature/manned-walls]
    paths: ['.maintenance/**', '.github/workflows/install-manned-walls.yml']
permissions:
  contents: write
defaults:
  run:
    shell: bash
concurrency:
  group: install-manned-walls
  cancel-in-progress: false
jobs:
  install:
    if: github.ref == 'refs/heads/feature/manned-walls'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/manned-walls
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the exact patch and all intended output files
        run: |
          mkdir -p verification-output
          python .maintenance/install-manned-walls.py | tee verification-output/installation.log
      - name: All simulation, staffing and wall regressions
        run: |
          node verification/smoke-test.js | tee verification-output/smoke-test.log
          node verification/militia-hunts-test.js | tee verification-output/militia-hunts-test.log
          node verification/clarity-test.js | tee verification-output/clarity-test.log
          node verification/baseline-equivalence-test.js | tee verification-output/baseline-equivalence.log
          PREVIOUS_RUNTIME_REF=9529f0ce8cc1f43c962f0e665a0ad9ced15c5519 node verification/baseline-equivalence-test.js | tee verification-output/previous-clarity-equivalence.log
          node verification/walls-test.js | tee verification-output/walls-test.log
      - name: Browser dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Real-origin desktop and touch-mobile acceptance
        run: |
          python verification/browser-hunts.py | tee verification-output/browser-hunts.log
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/walls-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          python verification/browser-clarity.py --url http://127.0.0.1:8765/ | tee verification-output/browser-clarity.log
          python verification/browser-walls.py --url http://127.0.0.1:8765/ | tee verification-output/browser-walls.log
      - name: Commit verified game content to the feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html README.md verification/baseline-equivalence-test.js verification/walls-test.js verification/browser-walls.py verification/performance-walls.py docs/releases/manned-walls.md
          git commit -m 'Add thicker manned walls, climbable towers and saved high-ground archery'
          git push origin HEAD:refs/heads/feature/manned-walls
          git rev-parse HEAD > verification-output/feature-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manned-walls-install-verification
          path: verification-output/
          retention-days: 14
