name: Verify final industry rendering
on:
  push:
    branches: [feature/industries-paid-life]
    paths: ['.maintenance/industry-overview.patch', '.github/workflows/install-industry.yml']
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/industries-paid-life
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply the exact drawing-only fallback
        run: |
          echo 'cf4a191a9c957a38976590d0fde60d406960f25eacd3a97604f15639e0d06f40  index.html' | sha256sum --check
          echo '8c2f772033d8ea2cb84897e62550c3d33861c898e6d5f363317ba1d5ebb90fc5  .maintenance/industry-overview.patch' | sha256sum --check
          git apply --check .maintenance/industry-overview.patch
          git apply .maintenance/industry-overview.patch
          echo '08ecc9d1be551d659ccc3f0d5b9038c8c9a97591c13b0cac3143b9c7a545d548  index.html' | sha256sum --check
      - name: Transactions and foreground fixture
        run: |
          mkdir -p verification-output
          node verification/industry-test.js | tee verification-output/industry-test.log
          node verification/industry-live-fixture.js | tee verification-output/industry-live-fixture.log
      - name: Browser dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Rendering and actual foreground service completion
        run: |
          python verification/browser-industry-render.py | tee verification-output/industry-render.log
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/industry-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          python verification/browser-industry.py --url http://127.0.0.1:8765/ | tee verification-output/industry-browser.log
          python verification/industry-live-soak.py --url http://127.0.0.1:8765/ --seconds 65 | tee verification-output/industry-live.log
      - name: Commit only the verified HTML
        run: |
          git add index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Keep sparse overview scenery direct and verify actual foreground industry activity'
          git push origin HEAD:refs/heads/feature/industries-paid-life
          git rev-parse HEAD > verification-output/feature-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: industry-final-render-verification
          path: verification-output/
          retention-days: 14
