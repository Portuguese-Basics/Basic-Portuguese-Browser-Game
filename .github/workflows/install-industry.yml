name: Integrate verified funded industries
on:
  push:
    branches: [feature/industries-paid-life]
    paths: ['.maintenance/industry-*', '.github/workflows/install-industry.yml']
permissions:
  contents: write
defaults:
  run:
    shell: bash
concurrency:
  group: integrate-funded-industries
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/industries-paid-life
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact baseline, patch and every output
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, subprocess
          from pathlib import Path
          assert hashlib.sha256(Path('index.html').read_bytes()).hexdigest() == '1b7e6a932d1574d7e248e6f649b8388ee8352274b5cb2ed0bb3f26ad8e8cc776'
          encoded = ''.join(Path(f'.maintenance/industry-part-{i}.b64').read_text() for i in range(1,5))
          assert hashlib.sha256(encoded.encode()).hexdigest() == 'aa9c706a0d6dc14a72a322280adeb3df452ca3f055f58e8dd7a929c7226f3dd1'
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '48642bb53a03562deb2939e1386df0508b187210c68d8823862c596b24a9d89c'
          Path('/tmp/industry.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/industry.patch'],check=True)
          subprocess.run(['git','apply','/tmp/industry.patch'],check=True)
          for name, expected in json.loads(Path('.maintenance/industry-output-sha256.json').read_text()).items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == expected, name
          encoded=Path('.maintenance/industry-optimize.b64').read_text()
          assert hashlib.sha256(encoded.encode()).hexdigest()=='0afe79ae3613780d3a579546d9fafb1eb4e01f3d53ae33b2c362089ccad1de77'
          patch=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='a4bcd19430978d340b474b809fe42e47559aed8761731303cf57b4c714a1e28c'
          Path('/tmp/industry-optimize.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/industry-optimize.patch'],check=True)
          subprocess.run(['git','apply','/tmp/industry-optimize.patch'],check=True)
          for name,expected in json.loads(Path('.maintenance/industry-optimize-sha256.json').read_text()).items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==expected,name
          print('ALL_FINAL_OUTPUT_HASHES_VERIFIED')
          PY
      - name: Full regressions, transactions and staged industry economy
        run: |
          mkdir -p verification-output
          for name in smoke-test militia-hunts-test clarity-test baseline-equivalence-test walls-test economy-test economy-soak-test daily-life-test daily-life-equivalence-test map-layout-test map-render-test road-render-test industry-test industry-soak-test industry-performance-equivalence-test; do
            node "verification/$name.js" 2>&1 | tee "verification-output/$name.log"
          done
          PREVIOUS_ACTIVE_REF=2c2069da81651b667c9e907ef07cdbd855c635d2 node verification/daily-life-equivalence-test.js 2>&1 | tee verification-output/inactive-baseline-equivalence.log
      - name: Independent footprints, actual destination routes and utilities
        run: |
          node verification/export-map-layout.js
          python -m pip install shapely==2.1.2 networkx==3.6.1
          python verification/map-geometry-audit.py 2>&1 | tee verification-output/map-geometry.log
          python verification/industry-geometry-test.py 2>&1 | tee verification-output/industry-geometry.log
      - name: Browser dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Seven real-origin desktop and touch-mobile suites
        run: |
          python verification/browser-hunts.py 2>&1 | tee verification-output/hunts-browser.log
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/industry-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          for name in clarity walls economy daily-life map-layout industry; do
            python "verification/browser-$name.py" --url http://127.0.0.1:8765/ 2>&1 | tee "verification-output/$name-browser.log"
          done
          python verification/browser-map-render.py 2>&1 | tee verification-output/map-raster.log
          python verification/browser-road-cache.py 2>&1 | tee verification-output/road-cache.log
          python verification/browser-industry-render.py 2>&1 | tee verification-output/industry-render.log
      - name: Commit verified content only, not workflows
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          names=sorted(set(json.loads(Path('.maintenance/industry-output-sha256.json').read_text()))|set(json.loads(Path('.maintenance/industry-optimize-sha256.json').read_text())))
          assert not any(n.startswith('.github/') for n in names)
          subprocess.run(['git','add','--',*names],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add funded cooperatives, hops and beer, leisure venues and paid destination visits'
          git push origin HEAD:refs/heads/feature/industries-paid-life
          git rev-parse HEAD > verification-output/feature-commit.txt
          git archive --format=zip --prefix=Basic-Portuguese-Browser-Game/ -o verification-output/feature-source.zip HEAD
          git bundle create verification-output/repository-history.bundle --all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: funded-industries-integration
          path: verification-output/
          retention-days: 14
